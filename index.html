<script>
  // URL da Implantação Executável do Apps Script (substitua pela sua URL)
  const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbxYq5VtCOFhpxCBNnuHM7OqvmGnAoSIgXXP3XGOBE_GBLtRgulel4al36I7acpH8u8/exec';

  let cacheBags = {};
  let cacheHistorico = [];

  window.addEventListener('DOMContentLoaded', () => {
    carregarDadosIniciais();
  });

  // 1. Carrega os dados mais recentes do Google Sheets
  function carregarDadosIniciais() {
    fetch(URL_WEB_APP)
      .then(res => res.json())
      .then(data => {
        if (data) {
          cacheBags = data.detalhesBags || {};
          cacheHistorico = data.historicoFichas || [];

          if (document.getElementById('inputProximoBag')) {
            document.getElementById('inputProximoBag').value = data.proximoBag || '';
          }
          if (document.getElementById('inputProximoLote')) {
            document.getElementById('inputProximoLote').value = data.proximoLote || '';
          }
        }
      })
      .catch(err => console.error('Erro ao buscar dados do Apps Script:', err));
  }

  // 2. Manipula e valida a Mão de Obra ("Outra...")
  function tratarMaoDeObra(selectElement) {
    const inputCustom = document.getElementById('maoDeObraCustom');
    if (selectElement.value === 'Outra...') {
      if (inputCustom) {
        inputCustom.style.display = 'block';
        inputCustom.required = true;
        inputCustom.focus();
      }
    } else {
      if (inputCustom) {
        inputCustom.style.display = 'none';
        inputCustom.required = false;
        inputCustom.value = '';
      }
    }
  }

  // Obter valor final da mão de obra selecionada ou digitada
  function obterValorMaoDeObra() {
    const select = document.getElementById('selectMaoDeObra');
    if (!select) return '';
    if (select.value === 'Outra...') {
      const inputCustom = document.getElementById('maoDeObraCustom');
      return inputCustom ? inputCustom.value.trim() : '';
    }
    return select.value;
  }

  // 3. Validação ao bipar/escanear BAG na Ficha de Mistura
  function buscarQuantidadeDoBag(inputBag) {
    let codigoBag = inputBag.value.trim().toUpperCase().split(' ')[0];
    if (!codigoBag) return;

    inputBag.value = codigoBag;
    const row = inputBag.closest('tr');
    const bagInfo = cacheBags[codigoBag];
    
    if (bagInfo) {
      const pesoOriginal = parseFloat(bagInfo.pesoOriginal) || 0;
      const saldoAtual = bagInfo.saldoAtual !== undefined ? parseFloat(bagInfo.saldoAtual) : pesoOriginal;

      // 🛑 Alerta 1: BAG consumido totalmente
      if (saldoAtual <= 0) {
        alert(`⚠️ ALERTA: O ${codigoBag} JÁ FOI TOTALMENTE CONSUMIDO!\n\nData da Baixa: ${bagInfo.dataBaixa || 'Já registrada anteriormente'}`);
        row.querySelector('.qtd-bag').value = "0.00";
        row.querySelector('.data-bag').value = bagInfo.dataEntrada || '';
        calcularSomaTotal();
        return;
      }

      // ℹ️ Alerta 2: BAG com consumo parcial
      if (saldoAtual < pesoOriginal) {
        alert(`ℹ️ AVISO: O ${codigoBag} já possui baixas anteriores.\n\nPeso Original: ${pesoOriginal.toFixed(2)} KG\nSaldo Restante: ${saldoAtual.toFixed(2)} KG`);
      }

      row.querySelector('.qtd-bag').value = saldoAtual.toFixed(2);
      row.querySelector('.data-bag').value = bagInfo.dataEntrada || '';

      row.setAttribute('data-cor', bagInfo.cor || '');
      row.setAttribute('data-tipo', bagInfo.tipo || '');
      row.setAttribute('data-data-entrada', bagInfo.dataEntrada || '');
      
      calcularSomaTotal();
    } else {
      alert(`❌ BAG "${codigoBag}" não foi localizado no sistema.`);
      row.querySelector('.qtd-bag').value = "";
      row.querySelector('.data-bag').value = "";
      calcularSomaTotal();
    }
  }

  // 4. Somar peso total da mistura
  function calcularSomaTotal() {
    let total = 0;
    document.querySelectorAll('.qtd-bag').forEach(input => {
      const valor = parseFloat(input.value) || 0;
      total += valor;
    });

    const campoTotal = document.getElementById('totalKgMistura');
    if (campoTotal) {
      campoTotal.value = total.toFixed(2);
    }
  }

  // 5. Adicionar nova linha de BAG
  function adicionarLinhaBag() {
    const tabela = document.getElementById('tabelaComponentes').getElementsByTagName('tbody')[0];
    const novaLinha = tabela.insertRow();

    novaLinha.innerHTML = `
      <td>
        <input type="text" class="form-control bag-id" placeholder="Bipe ou digite o BAG" onchange="buscarQuantidadeDoBag(this)">
      </td>
      <td>
        <input type="number" step="0.01" class="form-control qtd-bag" placeholder="0.00" oninput="calcularSomaTotal()">
      </td>
      <td>
        <input type="text" class="form-control data-bag" readonly>
      </td>
      <td class="text-center">
        <button type="button" class="btn btn-danger btn-sm" onclick="removerLinhaBag(this)">❌</button>
      </td>
    `;
  }

  // 6. Remover linha de BAG
  function removerLinhaBag(botao) {
    const linha = botao.closest('tr');
    linha.remove();
    calcularSomaTotal();
  }

  // 7. Enviar Entrada de Matéria-Prima
  function salvarEntradaMP() {
    const bagNo = document.getElementById('inputProximoBag').value;
    const dataEntrada = document.getElementById('dataEntrada').value;
    const cor = document.getElementById('corBag').value;
    const tipo = document.getElementById('tipoBag').value;
    const peso = parseFloat(document.getElementById('pesoBag').value) || 0;
    const fornecedor = document.getElementById('fornecedorBag').value;
    const maoDeObra = obterValorMaoDeObra();

    if (!bagNo || !peso || !dataEntrada) {
      alert("Preencha todos os campos obrigatórios da entrada!");
      return;
    }

    const payload = {
      tipoAcao: "ENTRADA_MATERIA_PRIMA",
      bagNo: bagNo,
      dataEntrada: dataEntrada,
      cor: cor,
      tipo: tipo,
      peso: peso,
      fornecedor: fornecedor,
      maoDeObra: maoDeObra
    };

    fetch(URL_WEB_APP, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'sucesso') {
        alert('✅ Entrada gravada com sucesso!');
        location.reload();
      } else {
        alert('❌ Erro ao gravar entrada.');
      }
    })
    .catch(err => alert('❌ Erro de conexão: ' + err));
  }

  // 8. Enviar Ficha de Mistura
  function salvarFichaMistura() {
    const noControle = document.getElementById('inputProximoLote').value;
    const dataMistura = document.getElementById('dataMistura').value;
    const corMistura = document.getElementById('corMistura').value;
    const totalKg = parseFloat(document.getElementById('totalKgMistura').value) || 0;
    const foiProducao = document.getElementById('foiProducao').value;
    const caixaProduzida = document.getElementById('caixaProduzida').value;

    if (!dataMistura || totalKg <= 0) {
      alert("Informe a data da mistura e selecione ao menos um BAG válido!");
      return;
    }

    const componentes = [];
    document.querySelectorAll('#tabelaComponentes tbody tr').forEach(row => {
      const bagNo = row.querySelector('.bag-id').value.trim();
      const qtdKg = parseFloat(row.querySelector('.qtd-bag').value) || 0;

      if (bagNo && qtdKg > 0) {
        componentes.push({
          bagNo: bagNo,
          qtdKg: qtdKg,
          dataEntrada: row.getAttribute('data-data-entrada') || row.querySelector('.data-bag').value,
          cor: row.getAttribute('data-cor') || '',
          tipo: row.getAttribute('data-tipo') || ''
        });
      }
    });

    const payload = {
      tipoAcao: "FICHA_MISTURA",
      noControle: noControle,
      dataMistura: dataMistura,
      corMistura: corMistura,
      qtdFinalKg: totalKg,
      foiProducao: foiProducao,
      caixaProduzida: caixaProduzida,
      componentes: componentes
    };

    fetch(URL_WEB_APP, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === 'sucesso') {
        alert('✅ Ficha de Mistura e baixas gravadas com sucesso!');
        location.reload();
      } else {
        alert('❌ Erro ao salvar ficha de mistura.');
      }
    })
    .catch(err => alert('❌ Erro de conexão: ' + err));
  }
</script>
